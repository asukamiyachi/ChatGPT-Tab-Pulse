name: Extension CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: node --test tests/*.test.js
      - name: JavaScript syntax checks
        run: |
          for file in background.js popup.js src/*.js; do node --check "$file"; done
      - name: Install Chromium test dependencies
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Browser smoke tests
        run: |
          python tests/browser_smoke.py
          python tests/failure_regression.py
          python tests/review_regression.py
          python tests/popup_smoke.py
          python tests/codex-popup-smoke.py
